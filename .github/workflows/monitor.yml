name: Uptime Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check app endpoint
        run: |
          URL="https://example.com/health"
          response=$(curl --write-out "%{http_code}" --silent --output /dev/null "$URL" || echo "000")
          echo "Health check status code: $response"
          # For now, we allow the workflow to succeed while testing templates
          exit 0