name: Pipeline Failure Alert

on:
  workflow_run:
    workflows: ["CI Pipeline", "CD Pipeline - Push to GHCR"]
    types:
      - completed

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.payload.workflow_run.id}`;
            
            await github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Workflow Failed: ${context.payload.workflow_run.name}`,
              body: `The workflow **${context.payload.workflow_run.name}** has failed.\n\n[View Run Logs](${runUrl})`
            });