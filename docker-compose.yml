version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: body_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bodytracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: body_tracker_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/bodytracker
      - JWT_SECRET=your_super_secret_jwt_key
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: body_tracker_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: